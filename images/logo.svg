<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- AI Circuit pattern -->
  <g transform="translate(8, 8)">
    <!-- Central node -->
    <circle cx="12" cy="12" r="3" fill="#ffffff"/>
    
    <!-- Connection nodes -->
    <circle cx="6" cy="6" r="1.5" fill="#60a5fa"/>
    <circle cx="18" cy="6" r="1.5" fill="#60a5fa"/>
    <circle cx="6" cy="18" r="1.5" fill="#60a5fa"/>
    <circle cx="18" cy="18" r="1.5" fill="#60a5fa"/>
    
    <!-- Connection lines -->
    <line x1="12" y1="12" x2="6" y2="6" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="12" x2="18" y2="6" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="12" x2="6" y2="18" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="12" x2="18" y2="18" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Additional circuit elements -->
    <rect x="3" y="11" width="6" height="2" fill="#60a5fa" opacity="0.6"/>
    <rect x="15" y="11" width="6" height="2" fill="#60a5fa" opacity="0.6"/>
    <rect x="11" y="3" width="2" height="6" fill="#60a5fa" opacity="0.6"/>
    <rect x="11" y="15" width="2" height="6" fill="#60a5fa" opacity="0.6"/>
  </g>
  
  <!-- Company text -->
  <text x="50" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#1e3a8a">
    LogicLAI
  </text>
  <text x="50" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="500" fill="#64748b" letter-spacing="0.1em">
    INTELLIGENT SOLUTIONS
  </text>
</svg>